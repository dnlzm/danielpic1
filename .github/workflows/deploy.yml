name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and theme
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Apply proposed Hugo Gallery compatibility patch
        run: |
          patch_file="${GITHUB_WORKSPACE}/hugo-theme-gallery-meta.patch"
          git -C themes/hugo-theme-gallery apply --check "$patch_file"
          git -C themes/hugo-theme-gallery apply "$patch_file"

      - name: Set up Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.170.0"
          extended: true
          dart-sass-version: "1.108.2"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build site
        run: hugo --minify

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
